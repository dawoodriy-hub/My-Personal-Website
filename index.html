<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dawood Riyazi — young coder, AI explorer and builder." />
    <meta name="theme-color" content="#07090f" />
    <title>Dawood — Young Coder & AI Builder</title>
    <style>
      .portfolio-games{display:inline-flex;align-items:center;gap:7px;margin-left:14px;color:#f5f7fb;text-decoration:none;font:500 12px/1 'DM Mono',monospace;letter-spacing:.03em;white-space:nowrap;transition:transform .2s,color .2s}.portfolio-games:hover{color:#9b92ff;transform:translateY(-1px)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const gamesUrl='https://wrathful-somber-disassembler--Dawood67.replit.app';
      const addGamesLink=()=>{const nav=document.querySelector('.nav');if(!nav||nav.querySelector('.portfolio-games'))return;const link=document.createElement('a');link.className='portfolio-games';link.href=gamesUrl;link.target='_blank';link.rel='noreferrer';link.innerHTML='🎮 Games!';nav.appendChild(link)};
      const observer=new MutationObserver(addGamesLink);observer.observe(document.getElementById('root'),{childList:true,subtree:true});addGamesLink();
    </script>
  </body>
</html>
